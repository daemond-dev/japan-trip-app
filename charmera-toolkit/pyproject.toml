[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "charmera-toolkit"
version = "0.1.0"
description = "Backup, inspection, verification, recovery and mod tools for the Kodak Charmera keychain camera (original 2025 series)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
charmera = "charmera_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["charmera_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
